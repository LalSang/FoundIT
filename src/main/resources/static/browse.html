<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>foundIT Browse Items</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page="browse">
    <nav class="top-nav">
      <div class="nav-container">
        <button
          type="button"
          id="nav-toggle-btn"
          class="nav-toggle"
          aria-label="Toggle navigation"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div class="nav-left">
          <a href="index.html" class="nav-brand">
            <img
              src="assets/logo.svg"
              alt="foundIT Logo"
              class="nav-logo"
              width="200"
              height="51"
            />
          </a>
        </div>

        <div class="nav-actions">
          <div class="nav-links">
            <a href="browse.html" class="nav-link">Browse Items</a>
            <a href="admin.html" id="nav-staff-link" class="nav-link" hidden>
              Create Listing
            </a>
            <a href="claimed.html" id="nav-claimed-link" class="nav-link" hidden>
              Claimed
            </a>
            <a href="index.html" id="nav-signout-link" class="nav-link" hidden>
              Sign Out
            </a>
          </div>
          <a href="signin.html" id="nav-auth-link" class="btn btn-primary">
            Sign In
          </a>
        </div>
      </div>
    </nav>

    <main class="browse-page">
      <section class="browse-shell" id="browse">
        <aside class="filter-panel" aria-labelledby="browse-filters-heading">
          <div class="filter-panel-header">
            <p class="section-eyebrow">Filter</p>
            <h1 id="browse-filters-heading">Browse campus listings</h1>
          </div>

          <form class="filter-form" id="browseFilters">
            <label class="filter-group">
              <span class="filter-label">Category</span>
              <select class="filter-select" name="category">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="IDs & Cards">IDs & Cards</option>
                <option value="Bags">Bags</option>
                <option value="Keys & Wallets">Keys & Wallets</option>
                <option value="Clothing">Clothing</option>
                <option value="School Supplies">School Supplies</option>
                <option value="Personal Items">Personal Items</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label class="filter-group">
              <span class="filter-label">Found Near</span>
              <select class="filter-select" name="foundNear">
                <option value="">All Locations</option>
                <option value="belk library">Belk Library</option>
                <option value="plemmons student union">
                  Plemmons Student Union
                </option>
                <option value="student recreation center">
                  Student Recreation Center
                </option>
                <option value="peacock hall">Peacock Hall</option>
                <option value="kidd brewer stadium">Kidd Brewer Stadium</option>
                <option value="sanford mall">Sanford Mall</option>
              </select>
            </label>

            <label class="filter-group">
              <span class="filter-label">Return To</span>
              <select class="filter-select" name="returnTo">
                <option value="">Any Front Desk</option>
                <option value="belk library front desk">
                  Belk Library Front Desk
                </option>
                <option value="plemmons student union information desk">
                  Plemmons Student Union Information Desk
                </option>
                <option value="student recreation center front desk">
                  Student Recreation Center Front Desk
                </option>
                <option value="peacock hall main office front desk">
                  Peacock Hall Main Office Front Desk
                </option>
                <option value="kidd brewer stadium guest services desk">
                  Kidd Brewer Stadium Guest Services Desk
                </option>
              </select>
            </label>

            <div class="filter-actions">
              <button type="submit" class="btn btn-primary">
                Apply Filters
              </button>
              <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
          </form>
        </aside>

        <section class="browse-results" aria-label="Lost and Found listings">
          <div class="browse-results-header">
            <div>
              <p class="section-eyebrow">Public Listings</p>
              <h2>Campus lost-and-found items</h2>
            </div>
          </div>

          <div id="browse-status" class="status-banner" hidden></div>
          <div id="itemGrid" class="item-grid" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <div id="claim-modal" class="claim-modal" hidden>
      <div class="claim-modal-backdrop" data-close-claim-modal></div>
      <section
        class="claim-modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="claim-modal-title"
      >
        <div class="claim-modal-header">
          <div class="claim-modal-copy">
            <h2 id="claim-modal-title" class="admin-simple-section-title">
              Start a claim
            </h2>
            <p id="claim-modal-item-copy" class="admin-simple-copy">
              Collect the claimer details before releasing the item.
            </p>
          </div>
          <button
            type="button"
            class="btn btn-secondary claim-close"
            data-close-claim-modal
          >
            Close
          </button>
        </div>

        <form id="claim-form" class="admin-simple-form claim-form">
          <input type="hidden" name="itemId" />

          <div class="claim-form-grid">
            <label class="filter-group">
              <span class="filter-label">First Name</span>
              <input
                class="filter-input"
                type="text"
                name="firstName"
                placeholder="Jamie"
                required
              />
            </label>

            <label class="filter-group">
              <span class="filter-label">Last Name</span>
              <input
                class="filter-input"
                type="text"
                name="lastName"
                placeholder="Doe"
                required
              />
            </label>
          </div>

          <label class="filter-group">
            <span class="filter-label">Claimer Type</span>
            <select
              id="claimant-type"
              class="filter-select"
              name="claimantType"
              required
            >
              <option value="student">Student</option>
              <option value="guest">Not a student</option>
            </select>
          </label>

          <p id="claim-guest-fields" class="claim-helper" hidden>
            If the claimer is not a student, make sure to check a real ID before
            releasing the item.
          </p>

          <div id="claim-student-fields" class="claim-conditional-group">
            <label class="filter-group">
              <span class="filter-label">Student ID</span>
              <input
                id="claim-student-id"
                class="filter-input"
                type="text"
                name="studentId"
                placeholder="Banner ID or student ID"
                required
              />
            </label>
          </div>

          <div class="claim-form-grid">
            <label class="filter-group">
              <span class="filter-label">Phone Number</span>
              <input
                id="claim-phone"
                class="filter-input"
                type="tel"
                name="phoneNum"
                placeholder="(555) 555-5555"
              />
            </label>

            <label class="filter-group">
              <span class="filter-label">Email</span>
              <input
                id="claim-email"
                class="filter-input"
                type="email"
                name="email"
                placeholder="name@example.com"
              />
            </label>
          </div>

          <div id="claim-status" class="status-banner" hidden></div>

          <div class="admin-simple-actions">
            <button type="submit" class="btn btn-primary">Save Claim</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-close-claim-modal
            >
              Cancel
            </button>
          </div>
        </form>
      </section>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
