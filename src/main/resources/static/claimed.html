<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Staff-only view of claimed campus lost-and-found items."
    />
    <title>foundIT Claimed Items</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body data-page="claimed">
    <nav class="top-nav">
      <div class="nav-container">
        <button
          type="button"
          id="nav-toggle-btn"
          class="nav-toggle"
          aria-label="Toggle navigation"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div class="nav-left">
          <a href="index.html" class="nav-brand">
            <img
              src="assets/logo.svg"
              alt="foundIT Logo"
              class="nav-logo"
              width="200"
              height="51"
            />
          </a>
        </div>

        <div class="nav-actions">
          <div class="nav-links">
            <a href="browse.html" class="nav-link">Browse Items</a>
            <a href="admin.html" id="nav-staff-link" class="nav-link" hidden>
              Create Listing
            </a>
            <a
              href="claimed.html"
              id="nav-claimed-link"
              class="nav-link"
              hidden
            >
              Claimed
            </a>
            <a href="index.html" id="nav-signout-link" class="nav-link" hidden>
              Sign Out
            </a>
          </div>
          <a href="signin.html" id="nav-auth-link" class="btn btn-primary">
            Sign In
          </a>
        </div>
      </div>
    </nav>

    <main class="browse-page">
      <section class="claimed-shell">
        <section class="browse-results" aria-label="Claimed items">
          <div class="browse-results-header">
            <div>
              <p class="section-eyebrow">Staff Claims</p>
              <h2>Claimed items</h2>
            </div>
          </div>

          <div id="claimed-status" class="status-banner" hidden></div>
          <div id="claimedGrid" class="item-grid" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
